apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsugar-backend-prod
  namespace: default
  labels:
    app: newsugar-backend
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsugar-backend
      env: prod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: newsugar-backend
        env: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: newsugar-backend
          image: 061039804626.dkr.ecr.ap-northeast-2.amazonaws.com/newsugar-backend:1d9dc5ef248b50bd311086491a87934ddaca1bb1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.MySQL8Dialect"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_SQL_INIT_MODE
              value: "never"
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: NEWS_API_KEY
            - name: QUIZ_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: QUIZ_AI_API_KEY
            - name: REDIS_HOST
              value: "redis-service-prod"
            - name: REDIS_PORT
              value: "6379"
            - name: ENABLE_SCHEDULER
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "86400000"
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: JWT_REFRESH_SECRET
            - name: JWT_REFRESH_EXPIRATION
              value: "604800000"
            - name: QUIZ_AI_TIMEOUT_MS
              value: "60000"
          envFrom:
            - secretRef:
                name: db-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
        - name: xray-daemon
          image: public.ecr.aws/xray/aws-xray-daemon:latest
          command: ["/xray", "-o", "-b", "0.0.0.0:2000"]
          ports:
            - containerPort: 2000
              protocol: UDP
          resources:
            requests:
              cpu: 256m
              memory: 32Mi
            limits:
              cpu: 512m
              memory: 64Mi
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
