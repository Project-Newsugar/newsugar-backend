apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsugar-backend-prod
  namespace: default
  labels:
    app: newsugar-backend
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsugar-backend
      env: prod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: newsugar-backend
        env: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: newsugar-backend
          image: 061039804626.dkr.ecr.ap-northeast-2.amazonaws.com/newsugar-backend:3c5354744f6ce45182390a83869d545d7cc5edda
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.MySQL8Dialect"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_SQL_INIT_MODE
              value: "always"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(DB_HOST):3306/news_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: SPRING_DATASOURCE_USERNAME
              value: "$(DB_USERNAME)"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "$(DB_PASSWORD)"
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: NEWS_API_KEY
            - name: QUIZ_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: QUIZ_AI_API_KEY
            - name: REDIS_HOST
              value: "newsugar-prod-redis.2iapp0.ng.0001.apn2.cache.amazonaws.com"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              value: "86400000"
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: newsugar-secrets-prod
                  key: JWT_REFRESH_SECRET
            - name: JWT_REFRESH_EXPIRATION
              value: "604800000"
            - name: QUIZ_AI_TIMEOUT_MS
              value: "60000"
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - secretRef:
                name: db-secret
            - name: AWS_XRAY_DAEMON_ADDRESS
              value: "$(HOST_IP):2000"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
