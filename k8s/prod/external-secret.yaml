apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-db-secret
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager-global
    kind: ClusterSecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_HOST
    remoteRef:
      key: newsugar/prod/db/auth-5e4911f8
      property: host
  - secretKey: DB_USERNAME
    remoteRef:
      key: newsugar/prod/db/auth-5e4911f8
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: newsugar/prod/db/auth-5e4911f8
      property: password
