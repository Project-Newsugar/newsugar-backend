apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: amazon-cloudwatch
  annotations:
    # Replace with your IAM Role ARN for Grafana (needs CloudWatchReadOnlyAccess)
    eks.amazonaws.com/role-arn: "arn:aws:iam::061039804626:role/NewsugarGrafanaRole"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: amazon-cloudwatch
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        uid: cloudwatch
        jsonData:
          defaultRegion: ap-northeast-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: amazon-cloudwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"  # 초기 비밀번호 (로그인 후 변경 권장)
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: amazon-cloudwatch
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
