apiVersion: v1
kind: ServiceAccount
metadata:
  name: xray-daemon
  namespace: amazon-cloudwatch
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::061039804626:role/NewsugarCloudWatchRole
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xray-daemon
  namespace: amazon-cloudwatch
spec:
  selector:
    matchLabels:
      app: xray-daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: xray-daemon
    spec:
      serviceAccountName: xray-daemon
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: xray-daemon
          image: public.ecr.aws/xray/aws-xray-daemon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2000
              name: xray-ingest
              protocol: UDP
            - containerPort: 2000
              name: xray-tcp
              protocol: TCP
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 256m
              memory: 64Mi
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
---
apiVersion: v1
kind: Service
metadata:
  name: xray-service
  namespace: amazon-cloudwatch
spec:
  selector:
    app: xray-daemon
  ports:
    - protocol: UDP
      port: 2000
      targetPort: 2000
  type: ClusterIP
